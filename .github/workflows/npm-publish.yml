name: Publish GitHub npm Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@attacker2007'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Publish to GitHub Packages
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Package: $PACKAGE_NAME @ $CURRENT_VER"
          if npm view "${PACKAGE_NAME}@${CURRENT_VER}" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Version $CURRENT_VER is already published to GitHub Packages. Skipping."
          else
            echo "Publishing $PACKAGE_NAME@$CURRENT_VER to GitHub Packages..."
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
